<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No 1</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            justify-content: flex-start;   
            align-items: flex-start;      
            height: 100vh;
            gap: 20px;
            padding: 20px;
        }

        .box {
            width: 200px;
            height: 200px;
            background-color: white;      
            color: black;                 
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border-radius: 8px;
            border: 2px solid black;      
        }

        /* Responsive Layout untuk Mobile */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: stretch; 
            }

            .box {
                width: 150px;
                height: 150px;
                border: 2px solid black;  
            }

            .box:nth-child(1) {
                background-color: red;
                align-self: flex-start; 
            }

            .box:nth-child(2) {
                background-color: yellow;
                align-self: center;       
            }

            .box:nth-child(3) {
                background-color: green;
                align-self: flex-end;   
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>

</body>
</html>
